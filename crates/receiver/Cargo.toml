[package]
name = "padlink-receiver"
description = "Turns padlink packets into virtual Xbox 360 / DualShock 4 controllers on Windows"
version.workspace = true
edition.workspace = true

[dependencies]
padlink-proto = { path = "../proto" }

[target.'cfg(windows)'.dependencies]
vigem-client = { version = "0.1", features = ["unstable_ds4", "unstable_xtarget_notification"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
