name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - run: cargo build --release -p padlink-receiver
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/padlink-tray.exe
            target/release/padlink-receiver.exe

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
          - target: x86_64-unknown-linux-musl
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release -p padlink-sender -p padlink-receiver --target ${{ matrix.target }}
      # Plain files with the architecture in the name: that is what install.sh downloads.
      - run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/padlink-sender dist/padlink-sender-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/padlink-receiver dist/padlink-receiver-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
