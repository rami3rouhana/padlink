name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  receiver-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p padlink-proto
      - run: cargo build --release -p padlink-receiver
      - uses: actions/upload-artifact@v4
        with:
          name: padlink-receiver-windows-x64
          path: target/release/padlink-receiver.exe

  sender-pi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            name: padlink-sender-pi-arm64
          - target: armv7-unknown-linux-musleabihf
            name: padlink-sender-pi-armv7
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release -p padlink-sender --target ${{ matrix.target }}
      - run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/padlink-sender deploy/batocera/padlink dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [receiver-windows, sender-pi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
